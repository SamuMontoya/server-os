# Proyecto generado por XcodeGen — el .xcodeproj NO se versiona.
# Se regenera con `xcodegen generate` desde esta carpeta.
#
# Por qué XcodeGen y no el .xcodeproj a mano: project.pbxproj es un formato
# denso y con IDs generados, imposible de revisar en un diff y muy fácil de
# romper editándolo. Este YAML es la fuente de verdad.

name: Hermes
options:
  bundleIdPrefix: com.samumontoya
  deploymentTarget:
    iOS: "16.0"
    # 10.0 y no 9.0: `onChange(of:initial:_:)` y las APIs de estado que usa
    # ContentView llegaron en watchOS 10.
    watchOS: "10.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    # La firma queda ACTIVA por defecto: es lo que necesita el camino de
    # Xcode (instalar directo en el iPhone y el reloj con un Apple ID
    # gratuito). build-ipa.sh la desactiva por línea de comandos cuando lo
    # que se quiere es el .ipa sin firmar para SideStore.
    CODE_SIGN_STYLE: Automatic
    # El equipo va AQUÍ y no solo en la UI de Xcode: `xcodegen generate`
    # reescribe el .xcodeproj entero, así que lo que se elige a mano en
    # Signing & Capabilities se pierde en la siguiente regeneración y el
    # build falla con "requires a development team".
    DEVELOPMENT_TEAM: 7LNN85JY33

targets:
  # ── Contenedor de iPhone ──────────────────────────────────────────────
  # No es decorativo: una app de Apple Watch no se distribuye sola fuera de
  # la App Store. Viaja dentro de este bundle, en Payload/Hermes.app/Watch/,
  # y quien la pasa al reloj es la app Watch del iPhone.
  Hermes:
    type: application
    platform: iOS
    sources: [Container]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.samumontoya.hermes
        PRODUCT_NAME: Hermes
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Container/Info.plist
      properties:
        CFBundleDisplayName: OS
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    dependencies:
      - target: HermesWatch
        embed: true
        copy:
          destination: productsDirectory
          subpath: "$(CONTENTS_FOLDER_PATH)/Watch"

  # ── App del reloj ─────────────────────────────────────────────────────
  # Target único (watchOS 9+): `WKApplication` en el Info.plist. El esquema
  # viejo de app + extensión ya no hace falta.
  HermesWatch:
    type: application
    platform: watchOS
    sources: [WatchApp]
    settings:
      base:
        # REGLA DURA de Apple: el id del reloj tiene que ser el del iPhone
        # más un sufijo. Si no, el reloj no reconoce la pareja.
        PRODUCT_BUNDLE_IDENTIFIER: com.samumontoya.hermes.watchkitapp
        PRODUCT_NAME: HermesWatch
        TARGETED_DEVICE_FAMILY: "4"
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: HermesComplicacion
        embed: true
        copy:
          destination: plugins
    info:
      path: WatchApp/Info.plist
      properties:
        CFBundleDisplayName: OS
        # El dictado del sistema pide el micrófono; sin esta clave la app se
        # cierra al presentarlo, sin mensaje útil.
        NSMicrophoneUsageDescription: Hermes usa el micrófono para dictarle.
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.samumontoya.hermes

  # ── Complicación ──────────────────────────────────────────────────────────
  # Acceso directo en la esfera. Es una extensión de WidgetKit: en watchOS 9+
  # las complicaciones ya no son ClockKit, son widgets con las familias
  # `accessory*`.
  HermesComplicacion:
    type: app-extension
    platform: watchOS
    sources: [Complicacion]
    settings:
      base:
        # El id cuelga del de la app del reloj, igual que el del reloj cuelga
        # del iPhone: Apple exige esa cadena para reconocer la pareja.
        PRODUCT_BUNDLE_IDENTIFIER: com.samumontoya.hermes.watchkitapp.complicacion
        PRODUCT_NAME: HermesComplicacion
        TARGETED_DEVICE_FAMILY: "4"
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
    info:
      path: Complicacion/Info.plist
      properties:
        CFBundleDisplayName: OS
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
